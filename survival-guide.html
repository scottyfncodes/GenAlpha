<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline Survival Guide</title>
<style>
:root{
  --bg:#0a0c0f; --bg-elev:#12151a; --bg-card:#191d24; --bg-card2:#1f2430;
  --border:#2b313c; --text:#f3f5f8; --text-dim:#aab2bf; --text-dim2:#7c8494;
  --accent:#ff5a3c; --accent-dim:#3a1c14; --accent2:#3ba7ff; --accent2-dim:#0f2233;
  --mild:#3fbf7f; --mild-bg:#0f2a1e; --moderate:#f0b73a; --moderate-bg:#2e2408;
  --severe:#ff4d4d; --severe-bg:#2e0f0f; --info:#3ba7ff; --info-bg:#0f2233;
  --focus:#ffd166; --radius:14px; --fs:18px;
}
*{box-sizing:border-box;}
html{font-size:var(--fs);}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5; -webkit-text-size-adjust:100%;
}
button, input, select{font-family:inherit; font-size:1rem; color:inherit;}
button{cursor:pointer;}
a{color:var(--accent2);}
h1,h2,h3,h4{line-height:1.25; margin:0 0 .5em;}
p{margin:0 0 .75em;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

#app-shell{display:flex; min-height:100vh;}

/* HEADER */
#topbar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:.5rem;
  background:var(--bg-elev); border-bottom:1px solid var(--border);
  padding:.6rem .7rem; flex-wrap:wrap;
}
#hamburger{
  display:none; min-width:48px; min-height:48px; background:var(--bg-card);
  border:1px solid var(--border); border-radius:10px; font-size:1.4rem; color:var(--text);
}
.brand{display:flex; align-items:center; gap:.5rem; font-weight:800; font-size:1.05rem; white-space:nowrap;}
.brand .flag{font-size:1.3rem;}
#search-wrap{position:relative; flex:1 1 240px; min-width:140px;}
#search-input{
  width:100%; min-height:48px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg-card); color:var(--text); padding:.5rem .9rem; font-size:1rem;
}
#search-input:focus{outline:3px solid var(--focus); outline-offset:1px;}
#search-results{
  position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--bg-card2);
  border:1px solid var(--border); border-radius:12px; max-height:60vh; overflow:auto;
  z-index:60; box-shadow:0 12px 32px rgba(0,0,0,.5); display:none;
}
#search-results.show{display:block;}
.sr-item{
  display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--border);
  padding:.75rem .9rem; min-height:48px;
}
.sr-item:last-child{border-bottom:0;}
.sr-item:hover, .sr-item:focus{background:var(--bg-elev);}
.sr-cat{color:var(--text-dim2); font-size:.78rem; text-transform:uppercase; letter-spacing:.04em;}
.sr-title{font-weight:700;}
.sr-empty{padding:.9rem; color:var(--text-dim);}
.icon-btn{
  min-width:48px; min-height:48px; border-radius:10px; background:var(--bg-card);
  border:1px solid var(--border); padding:.4rem .7rem; font-weight:700; font-size:.95rem;
}
.icon-btn:hover{border-color:var(--accent2);}
#emergency-btn{
  min-height:52px; background:var(--accent); border:0; color:#1a0a05; font-weight:900;
  border-radius:12px; padding:.6rem 1rem; font-size:1.02rem; letter-spacing:.02em;
  box-shadow:0 0 0 3px var(--accent-dim);
  display:flex; align-items:center; gap:.4rem; white-space:nowrap;
}
#emergency-btn:hover{filter:brightness(1.08);}

/* SIDEBAR */
#sidebar{
  width:250px; flex-shrink:0; background:var(--bg-elev); border-right:1px solid var(--border);
  position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto; padding:.75rem;
}
.nav-group-label{
  color:var(--text-dim2); font-size:.72rem; text-transform:uppercase; letter-spacing:.06em;
  margin:1rem .5rem .35rem; font-weight:700;
}
.nav-group-label:first-child{margin-top:.25rem;}
.nav-btn{
  display:flex; align-items:center; gap:.6rem; width:100%; min-height:50px;
  background:none; border:0; color:var(--text); border-radius:10px; padding:.55rem .6rem;
  text-align:left; font-size:.98rem; font-weight:600;
}
.nav-btn .ic{font-size:1.15rem; width:1.4em; text-align:center;}
.nav-btn:hover{background:var(--bg-card);}
.nav-btn.active{background:var(--accent2-dim); color:var(--accent2); box-shadow:inset 3px 0 0 var(--accent2);}
#sidebar-scrim{display:none;}

/* MAIN */
#main{flex:1; min-width:0; padding:1rem 1rem 4rem;}
.container{max-width:880px; margin:0 auto;}
.hero{
  background:linear-gradient(180deg,var(--bg-card),var(--bg-elev)); border:1px solid var(--border);
  border-radius:var(--radius); padding:1.4rem 1.2rem; margin-bottom:1rem;
}
.hero h1{font-size:1.5rem;}
.hero p{color:var(--text-dim);}
.big-emergency{
  display:flex; align-items:center; justify-content:center; gap:.6rem; width:100%;
  min-height:88px; background:var(--accent); color:#1a0a05; border:0; border-radius:16px;
  font-size:1.35rem; font-weight:900; margin:1rem 0; box-shadow:0 0 0 6px var(--accent-dim);
}
.big-emergency small{display:block; font-size:.6em; font-weight:700; opacity:.85;}
.secondary-row{display:flex; gap:.7rem; flex-wrap:wrap;}
.btn{
  min-height:52px; border-radius:12px; border:1px solid var(--border); background:var(--bg-card);
  color:var(--text); padding:.6rem 1rem; font-weight:700; font-size:1rem; display:inline-flex;
  align-items:center; gap:.5rem; flex:1 1 auto; justify-content:center;
}
.btn:hover{border-color:var(--accent2);}
.btn.primary{background:var(--accent2-dim); border-color:var(--accent2); color:var(--accent2);}
.btn.ghost{background:none;}
.btn.small{min-height:44px; padding:.45rem .8rem; font-size:.9rem; flex:none;}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:.8rem; margin:1rem 0;}
.card{
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:1rem; position:relative; min-height:110px;
}
.card-link{display:block; width:100%; text-align:left; background:none; border:0; color:var(--text); min-height:110px;}
.card h3{font-size:1.05rem; margin-bottom:.25rem;}
.card p{color:var(--text-dim); font-size:.88rem; margin:0;}
.card .ic{font-size:1.6rem; display:block; margin-bottom:.4rem;}
.fav-btn{
  position:absolute; top:.5rem; right:.5rem; min-width:40px; min-height:40px; background:none;
  border:0; font-size:1.25rem; color:var(--text-dim2);
}
.fav-btn.active{color:var(--moderate);}

.section{
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:1.1rem; margin-bottom:1rem;
}
.section h2{font-size:1.25rem; display:flex; align-items:center; gap:.5rem;}
.section h3{font-size:1.05rem; margin-top:1rem;}

.badge{
  display:inline-block; padding:.2rem .6rem; border-radius:999px; font-size:.78rem; font-weight:800;
  text-transform:uppercase; letter-spacing:.03em;
}
.badge.mild{background:var(--mild-bg); color:var(--mild);}
.badge.moderate{background:var(--moderate-bg); color:var(--moderate);}
.badge.severe{background:var(--severe-bg); color:var(--severe);}
.badge.info{background:var(--info-bg); color:var(--info);}

.result-card{border-radius:var(--radius); padding:1rem; margin:.7rem 0; border:2px solid; }
.result-card.mild{border-color:var(--mild); background:var(--mild-bg);}
.result-card.moderate{border-color:var(--moderate); background:var(--moderate-bg);}
.result-card.severe{border-color:var(--severe); background:var(--severe-bg);}
.result-card.info{border-color:var(--info); background:var(--info-bg);}
.result-card h3{margin-top:0;}
.result-card ol, .result-card ul{margin:.4rem 0 0; padding-left:1.3rem;}
.result-card li{margin-bottom:.4rem;}

.notdo{
  border:2px dashed var(--severe); background:var(--severe-bg); border-radius:12px;
  padding:.8rem 1rem; margin-top:.8rem;
}
.notdo h4{color:var(--severe); margin:0 0 .4rem; display:flex; align-items:center; gap:.4rem;}
.notdo ul{margin:0; padding-left:1.2rem;}
.notdo li{margin-bottom:.3rem;}

.qbtn-list{display:flex; flex-direction:column; gap:.6rem; margin-top:.8rem;}
.qbtn{
  min-height:56px; text-align:left; background:var(--bg-card2); border:1px solid var(--border);
  border-radius:12px; padding:.7rem 1rem; font-weight:700; font-size:1.02rem; color:var(--text);
  display:flex; justify-content:space-between; align-items:center; gap:.5rem;
}
.qbtn:hover{border-color:var(--accent2); background:var(--info-bg);}
.qbtn .arrow{color:var(--text-dim2);}

.entry-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:.6rem; margin-top:.8rem;}
.entry-btn{
  min-height:64px; background:var(--bg-card2); border:1px solid var(--border); border-radius:12px;
  padding:.6rem .9rem; font-weight:700; text-align:left; display:flex; align-items:center; gap:.6rem;
  position:relative;
}
.entry-btn:hover{border-color:var(--accent);}
.entry-btn .ic{font-size:1.4rem;}

.breadcrumb{display:flex; gap:.4rem; align-items:center; color:var(--text-dim2); font-size:.85rem; margin-bottom:.6rem; flex-wrap:wrap;}
.breadcrumb button{background:none;border:0;color:var(--accent2); font-size:.85rem; padding:.2rem;}

.legend-row{display:flex; gap:.6rem; flex-wrap:wrap; margin:.6rem 0;}
.legend-chip{display:flex; align-items:center; gap:.4rem; background:var(--bg-card2); border:1px solid var(--border); border-radius:999px; padding:.3rem .7rem; font-size:.85rem;}
.jump-row{display:flex; gap:.5rem; flex-wrap:wrap; margin:.9rem 0;}
.jump-chip{background:var(--bg-card2); border:1px solid var(--border); border-radius:999px; padding:.5rem .9rem; font-size:.85rem; font-weight:700; color:var(--accent2); text-decoration:none; min-height:44px; display:inline-flex; align-items:center;}
.jump-chip:hover{border-color:var(--accent2);}
.dot{width:.7rem; height:.7rem; border-radius:50%; display:inline-block;}
.dot.mild{background:var(--mild);} .dot.moderate{background:var(--moderate);} .dot.severe{background:var(--severe);}

/* SVG viewers */
.svg-viewer{background:var(--bg-card2); border:1px solid var(--border); border-radius:12px; padding:.8rem; margin:.8rem 0;}
.svg-stage{width:100%; max-width:420px; margin:0 auto; display:block;}
.svg-controls{display:flex; justify-content:space-between; align-items:center; margin-top:.6rem; gap:.5rem;}
.svg-caption{text-align:center; color:var(--text-dim); font-size:.92rem; min-height:2.6em; margin-top:.4rem;}
.step-dots{display:flex; gap:.35rem; justify-content:center;}
.step-dots span{width:.55rem; height:.55rem; border-radius:50%; background:var(--border); display:inline-block;}
.step-dots span.active{background:var(--accent2);}

/* Calculators */
.calc-row{display:flex; gap:.7rem; flex-wrap:wrap; align-items:flex-end; margin:.6rem 0;}
.field{display:flex; flex-direction:column; gap:.3rem; flex:1 1 140px;}
.field label{font-size:.85rem; color:var(--text-dim); font-weight:700;}
.field input, .field select{
  min-height:48px; border-radius:10px; border:1px solid var(--border); background:var(--bg-elev);
  color:var(--text); padding:.5rem .7rem;
}
.field input:focus, .field select:focus{outline:3px solid var(--focus);}
.calc-output{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:12px; padding:.9rem; margin-top:.6rem;
}
.calc-output .big-num{font-size:1.7rem; font-weight:900; color:var(--accent2);}
.calc-output .lbl{color:var(--text-dim); font-size:.85rem;}
.out-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:.7rem;}

table.ref-table{width:100%; border-collapse:collapse; margin:.6rem 0;}
table.ref-table th, table.ref-table td{border-bottom:1px solid var(--border); padding:.5rem .4rem; text-align:left; font-size:.92rem;}
table.ref-table th{color:var(--text-dim2); text-transform:uppercase; font-size:.72rem; letter-spacing:.04em;}

.qr-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:.7rem;}
.qr-card{background:var(--bg-card2); border:1px solid var(--border); border-left:5px solid var(--accent2); border-radius:10px; padding:.8rem;}
.qr-card h4{margin:0 0 .3rem; font-size:.98rem;}
.qr-card p{margin:0; color:var(--text-dim); font-size:.88rem;}

footer.appfoot{text-align:center; color:var(--text-dim2); font-size:.82rem; padding:1.2rem 0 .4rem;}

@media (max-width:840px){
  #sidebar{
    position:fixed; left:0; top:0; height:100%; z-index:80; transform:translateX(-105%);
    transition:transform .2s ease; box-shadow:0 0 40px rgba(0,0,0,.6); width:280px;
  }
  #sidebar.open{transform:translateX(0);}
  #hamburger{display:inline-flex; align-items:center; justify-content:center;}
  #sidebar-scrim{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:70;
  }
  #sidebar-scrim.show{display:block;}
  .brand span.full{display:none;}
}
@media (min-width:841px){
  #sidebar-close{display:none;}
}
@media (max-width:520px){
  .big-emergency{font-size:1.1rem;}
  #topbar{gap:.4rem;}
  .brand{font-size:.95rem;}
}

@media print{
  #topbar, #sidebar, #sidebar-scrim, .no-print{display:none !important;}
  #main{padding:0;}
  body{background:#fff; color:#000;}
  .section, .result-card, .card, .qr-card{border-color:#999 !important; background:#fff !important; color:#000 !important;}
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}
</style>
</head>
<body>
<div id="app-shell">
  <nav id="sidebar" aria-label="Category navigation"></nav>
  <div id="sidebar-scrim"></div>
  <div style="flex:1; min-width:0; display:flex; flex-direction:column;">
    <header id="topbar">
      <button id="hamburger" aria-label="Open menu" aria-expanded="false">&#9776;</button>
      <div class="brand"><span class="flag">&#9906;</span><span class="full">Survival Guide</span></div>
      <div id="search-wrap">
        <label class="visually-hidden" for="search-input">Search the guide</label>
        <input id="search-input" type="search" placeholder="Search e.g. bleeding, water, north..." autocomplete="off">
        <div id="search-results" role="listbox"></div>
      </div>
      <button class="icon-btn" id="fontsize-btn" title="Text size">A&plusmn;</button>
      <button class="icon-btn" id="units-btn" title="Units">--</button>
      <button id="emergency-btn" data-go="triage:entry:start">&#9888; Emergency</button>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="appfoot no-print">100% offline &middot; no data leaves this device &middot; not a substitute for professional medical care or emergency services when available</footer>
  </div>
</div>
<script>
(function(){
"use strict";

var state = {
  route: {view:"home"},
  history: [],
  fontSize: 1, // index into FONT_SIZES
  units: "imperial",
  favorites: new Set(),
  checklists: {},
  quiz: {order: null, idx:0, score:0, answered:0, done:false}
};
var FONT_SIZES = [16,18,21,25];
var FONT_LABELS = ["S","M","L","XL"];

function galToL(g){ return g*3.78541; }
function lToGal(l){ return l/3.78541; }
function fToC(f){ return (f-32)*5/9; }
function cToF(c){ return c*9/5+32; }
function miToKm(m){ return m*1.60934; }
function round1(n){ return Math.round(n*10)/10; }

/* ---------------- CATEGORY DEFINITIONS ---------------- */
var CATEGORIES = [
  {id:"firstaid", name:"First Aid", ic:"&#9877;"},
  {id:"water", name:"Water & Food", ic:"&#128167;"},
  {id:"shelter", name:"Shelter", ic:"&#9974;"},
  {id:"fire", name:"Fire", ic:"&#128293;"},
  {id:"nav", name:"Navigation", ic:"&#129517;"},
  {id:"signal", name:"Signaling", ic:"&#128225;"},
  {id:"weather", name:"Weather", ic:"&#9928;"},
  {id:"wildlife", name:"Wildlife", ic:"&#128062;"},
  {id:"vehicle", name:"Vehicle Emergencies", ic:"&#128663;"},
  {id:"longterm", name:"Long-Term Survival", ic:"&#127806;"}
];

/* ---------------- FIRST AID TRIAGE FLOWS ---------------- */
function step(t){ return t; }
var TRIAGE_FLOWS = {
  entry:{
    start:{type:"menu", title:"What's the situation?", items:[
      {label:"Not breathing / unresponsive", ic:"&#128557;", go:"breathing:start"},
      {label:"Severe bleeding", ic:"&#129656;", go:"bleeding:start"},
      {label:"Choking", ic:"&#128557;", go:"choking:start"},
      {label:"Burn", ic:"&#128293;", go:"burns:start"},
      {label:"Broken bone / severe sprain", ic:"&#129446;", go:"fracture:start"},
      {label:"Cold exposure / hypothermia", ic:"&#10052;", go:"hypothermia:start"},
      {label:"Overheating / heat illness", ic:"&#9728;", go:"heat:start"},
      {label:"Dehydration", ic:"&#128167;", go:"dehydration:start"},
      {label:"Snake or animal bite", ic:"&#128013;", go:"snakebite:start"},
      {label:"Shock (pale, cold, rapid pulse)", ic:"&#128148;", go:"shock:start"},
      {label:"Allergic reaction / anaphylaxis", ic:"&#128163;", go:"allergic:start"}
    ]}
  },
  breathing:{
    start:{type:"q", text:"Is the person responsive? Tap their shoulder and shout.", options:[
      {label:"Yes, responsive", next:"responsive"},
      {label:"No response", next:"check_breathing"}
    ]},
    check_breathing:{type:"q", text:"Is the person breathing normally?", options:[
      {label:"Yes, breathing normally", next:"recovery"},
      {label:"No, not breathing or gasping", next:"no_breath"}
    ]},
    responsive:{type:"result", severity:"moderate", title:"Responsive",
      steps:["Check for visible injuries and severe bleeding first.","Keep the person still and calm.","Call/send for emergency help if condition is serious or unclear.","Continue to monitor breathing and responsiveness."]},
    recovery:{type:"result", severity:"moderate", title:"Breathing, unresponsive: recovery position",
      steps:["Roll the person onto their side.","Tilt the head back slightly to keep the airway open.","Bend the top knee to stabilize the body.","Monitor breathing continuously until help arrives.","Call/send for emergency help."]},
    no_breath:{type:"result", severity:"severe", title:"Not breathing: begin CPR now",
      steps:["Call or send someone to call for emergency help immediately.","Begin chest compressions: push hard and fast in the center of the chest, about 2 in (5 cm) deep, 100-120 per minute.","Give 30 compressions, then 2 rescue breaths (tilt head, lift chin, pinch nose).","Repeat 30:2 continuously until the person responds, breathes normally, or help arrives.","Use an AED immediately if one is available - follow its voice prompts."],
      notdo:["Don't stop compressions for long to search for a pulse.","Don't tilt the head back forcefully if a neck/spinal injury is suspected - use a jaw-thrust instead if trained.","Don't give up - continue CPR until help arrives or the person recovers."]}
  },
  bleeding:{
    start:{type:"q", text:"Is blood spurting, pumping, or pooling rapidly?", options:[
      {label:"Yes, severe/rapid", next:"severe"},
      {label:"No, slow or oozing", next:"moderate_q"}
    ]},
    moderate_q:{type:"q", text:"Does the bleeding stop with a few minutes of firm direct pressure?", options:[
      {label:"Yes, it slows/stops", next:"mild"},
      {label:"No, it keeps bleeding", next:"severe"}
    ]},
    mild:{type:"result", severity:"mild", title:"Minor bleeding",
      steps:["Clean the wound with clean water if available.","Apply direct pressure with a clean cloth until bleeding stops.","Apply antiseptic if available and cover with a clean bandage.","Watch for signs of infection over the following days (redness, swelling, warmth, pus)."]},
    severe:{type:"result", severity:"severe", title:"Severe bleeding: act fast",
      steps:["Apply firm, direct pressure on the wound with the cleanest cloth available.","If bleeding soaks through, add more layers on top - do not remove the original dressing.","For a life-threatening limb wound that won't stop, apply a tourniquet 2-3 in (5-8 cm) above the wound (not on a joint). Note the time it was applied.","Keep the person still; elevate the injury above heart level if possible and no fracture is suspected.","Treat for shock (see Shock) and get emergency help immediately."],
      notdo:["Don't remove an embedded object - pack and bandage around it instead.","Don't loosen or remove a tourniquet once applied.","Don't repeatedly lift the dressing to check the wound - it disrupts clotting."]}
  },
  choking:{
    start:{type:"q", text:"Can the person cough forcefully, speak, or breathe at all?", options:[
      {label:"Yes, some air movement", next:"mild"},
      {label:"No, silent and can't breathe", next:"severe"}
    ]},
    mild:{type:"result", severity:"mild", title:"Partial airway obstruction",
      steps:["Encourage the person to keep coughing forcefully - this is the body's best way to clear it.","Stay with them and stay calm.","If it worsens to a silent, complete blockage, move to the severe steps immediately."]},
    severe:{type:"result", severity:"severe", title:"Complete airway obstruction",
      steps:["Stand behind the person, lean them forward.","Give 5 firm back blows between the shoulder blades with the heel of your hand.","If unresolved, give 5 abdominal thrusts (Heimlich maneuver): fist above navel, grasp with other hand, thrust sharply inward/upward.","Alternate 5 back blows and 5 abdominal thrusts until the object clears or the person becomes unresponsive.","If they become unresponsive, lower them to the ground and begin CPR - check the mouth for the object before rescue breaths."],
      notdo:["Don't perform blind finger sweeps of the mouth.","For infants, use back blows and chest thrusts instead of abdominal thrusts.","Don't leave the person alone to go find help unless absolutely necessary."]}
  },
  burns:{
    start:{type:"q", text:"Is the skin charred, white/leathery, or is the burn larger than the person's hand?", options:[
      {label:"Yes", next:"severe"},
      {label:"No", next:"blister_q"}
    ]},
    blister_q:{type:"q", text:"Are there blisters present?", options:[
      {label:"Yes, blistering", next:"moderate"},
      {label:"No, just red/painful skin", next:"mild"}
    ]},
    mild:{type:"result", severity:"mild", title:"Minor (first-degree) burn",
      steps:["Cool under clean running water for 10-20 minutes.","Cover loosely with a clean, non-stick dressing.","Give pain relief if available and appropriate.","Do not apply ice directly."]},
    moderate:{type:"result", severity:"moderate", title:"Moderate (second-degree) burn",
      steps:["Cool with clean water for about 20 minutes.","Cover loosely with a clean, non-stick dressing - do not wrap tightly.","Do not pop or drain blisters.","Seek medical care if the burn is on the face, hands, feet, joints, or genitals, or is larger than a few inches."]},

/* ---------------- VIEWS ---------------- */
function go(route, opts){
  opts = opts || {};
  if(opts.push !== false){ state.history.push(state.route); }
  state.route = route;
  render();
  var m = document.getElementById("main");
  if(m){ m.scrollTop = 0; m.focus({preventScroll:true}); window.scrollTo(0,0); }
  closeSidebar();
}
function goBack(){
  if(state.history.length){ state.route = state.history.pop(); render(); }
  else { go({view:"home"}, {push:false}); }
}

    fire:"Methods, tinder, and fire safety.",

function renderFavList(){
  if(!state.favorites.size) return '<p style="color:var(--text-dim)">No favorites yet. Tap the star on any card or item to save it here.</p>';
  var html = '<div class="qbtn-list">';
  state.favorites.forEach(function(key){
    var label = favLabel(key);
    html += '<button class="qbtn" data-go="fav:'+key+'"><span>'+esc(label)+'</span><span class="arrow">&rarr;</span></button>';
  });
  html += '</div>';
  return html;
}
function favLabel(key){
  var parts = key.split(":");
  if(parts[0]==="cat"){ var c=CATEGORIES.filter(function(x){return x.id===parts[1];})[0]; return c?c.name:key; }
  if(parts[0]==="triage"){ var f=parts[1]; var item = TRIAGE_FLOWS.entry.start.items.filter(function(i){return i.go.split(":")[0]===f;})[0]; return item?item.label:key; }
  if(parts[0]==="qr"){ return "Quick Ref: "+QUICK_REF[+parts[1]].t; }
  return key;
}
function goFav(key){
  var parts = key.split(":");
  if(parts[0]==="cat") return go({view:"category", cat:parts[1]});
  if(parts[0]==="triage") return go({view:"triage", flow:parts[1], node:"start"});
  if(parts[0]==="qr") return go({view:"quickref"});
  return go({view:"home"});
}

function computeWater(){
  var volInput = parseFloat(document.getElementById("wf-vol").value) || 0;
  var liters = state.units === "imperial" ? galToL(volInput) : volInput;
  var dropsClear = Math.ceil(liters * 2);
  var dropsCloudy = Math.ceil(liters * 4);
  var tablets = Math.max(1, Math.ceil(liters));
  var out = document.getElementById("wf-output");
  if(!out) return;
  out.innerHTML = '<div class="out-grid">'+
    '<div><div class="big-num">'+dropsClear+'</div><div class="lbl">bleach drops (clear water)</div></div>'+
    '<div><div class="big-num">'+dropsCloudy+'</div><div class="lbl">bleach drops (cloudy water)</div></div>'+
    '<div><div class="big-num">'+tablets+'</div><div class="lbl">purification tablets (~1/liter)</div></div>'+
    '</div><p style="margin-top:.6rem; color:var(--text-dim)">Use unscented bleach, 5-9% sodium hypochlorite, no additives. Mix, stir, and wait 30 minutes before drinking.</p>';
}
var CAL_RATES = {low:2000, moderate:2800, high:4000};
function computeCalories(){
  var people = parseInt(document.getElementById("cal-people").value) || 0;
  var days = parseInt(document.getElementById("cal-days").value) || 0;
  var act = document.getElementById("cal-activity").value;
  var rate = CAL_RATES[act];
  var daily = people * rate;
  var total = daily * days;
  var minSurvival = people * 1200 * days;
  var out = document.getElementById("cal-output");
  if(!out) return;
  out.innerHTML = '<div class="out-grid">'+
    '<div><div class="big-num">'+daily.toLocaleString()+'</div><div class="lbl">kcal / day, all people</div></div>'+
    '<div><div class="big-num">'+total.toLocaleString()+'</div><div class="lbl">kcal total over '+days+' day(s)</div></div>'+
    '<div><div class="big-num">'+minSurvival.toLocaleString()+'</div><div class="lbl">kcal, bare minimum ration (short-term only)</div></div>'+
    '</div><p style="margin-top:.6rem; color:var(--text-dim)">If supplies are limited, prioritize water first, then ration food evenly rather than front-loading. A minimum ~1,200 kcal/person/day can sustain short emergencies but is not adequate long-term.</p>';
}

  var html = '<div class="breadcrumb"><button data-go="home">&larr; Home</button></div>';
  html += '<div class="section"><h2>&#128663; Vehicle Emergencies</h2>';
  html += '<h3>Stranded in snow</h3><p>Stay with the vehicle - it\'s far easier for rescuers to find than a person on foot. Run the engine about 10 minutes each hour for heat, cracking a window for ventilation. Make sure the exhaust pipe isn\'t blocked by snow (carbon monoxide risk). Stay visible: tie bright cloth to the antenna, use the dome light at night. Keep moving your arms and legs to maintain circulation.</p>';
  html += '<h3>Breakdown on the road</h3><p>Pull as far off the roadway as possible and turn on hazard lights. Place flares or reflective triangles behind the vehicle if available. If it\'s safer, exit away from traffic to a location off the road; if you stay inside, keep your seatbelt on.</p>';
  html += '<h3>Stuck in mud or sand</h3><p>Don\'t spin the wheels - it digs you in deeper. Clear debris/sand from around the tires, use traction aids like boards or floor mats, and for sand, slightly deflating tires can help. Rock the vehicle gently forward and back if safe to do so.</p>';
  html += '<h3>Overheating engine</h3><p>Pull over safely and turn off the AC, turning on the heater to draw heat away from the engine. Let it cool 15-20 minutes before opening the hood. Never open a hot radiator cap - pressurized coolant can cause severe burns.</p>';
  html += '<h3>Submerged / sinking vehicle</h3><p>Unbuckle your seatbelt immediately and open a window or break it right away, before the vehicle fully submerges - power windows and doors can fail once underwater. Get out through the window if the door won\'t open, get children or the lightest occupants out first, then swim to the surface.</p>';
  html += '<h3>Keep in the vehicle</h3><p>Blanket, water, flashlight, basic tools, jumper cables, and some food make up a solid baseline emergency kit.</p>';
  html += '</div>';
  return html;
}

/* ---- Long-Term Survival ---- */
function renderLongTerm(){
  var html = '<div class="breadcrumb"><button data-go="home">&larr; Home</button></div>';
  html += '<div class="section"><h2>&#127806; Long-Term Survival</h2>';
  html += '<p>For extended, infrastructure-down scenarios rather than a single emergency: growing and preserving food, staying healthy without hospitals, and building resilience over months, not hours.</p>';
  html += '<div class="jump-row">'+
    '<a class="jump-chip" href="#lt-farming">Farming</a>'+
    '<a class="jump-chip" href="#lt-plants">Plants</a>'+
    '<a class="jump-chip" href="#lt-preservation">Preservation &amp; Water</a>'+
    '<a class="jump-chip" href="#lt-health">Sanitation &amp; Medicine</a>'+
    '<a class="jump-chip" href="#lt-barter">Barter</a>'+
    '<a class="jump-chip" href="#lt-power">Power &amp; Tools</a>'+
    '<a class="jump-chip" href="#lt-community">Community</a>'+
  '</div></div>';

  html += '<div class="section" id="lt-farming"><h2>&#127793; Farming &amp; Food Production</h2>';
  html += '<h3>Start with reliable staples</h3><p>Potatoes, beans, and squash are traditionally grown together as the "Three Sisters": corn or another tall stalk supports climbing bean vines, beans fix nitrogen into the soil for the other two, and squash leaves shade out weeds and hold in moisture.</p>';
  html += '<ul><li><b>Potatoes</b> - calorie-dense and store well through winter in a cool, dark space.</li><li><b>Beans</b> - a reliable protein source that also improves the soil they grow in.</li><li><b>Squash</b> - many varieties store for months without refrigeration.</li><li><b>Leafy greens</b> - fast-growing (30-60 days), useful for quick nutrition between larger harvests.</li></ul>';
  html += '<h3>Seed saving</h3><p>Only open-pollinated or heirloom seeds reliably breed true year after year - most hybrid seeds do not. Beans, peas, tomatoes, peppers, and lettuce are the easiest crops to save seed from, since they are self-pollinating and rarely cross with other varieties. Dry seeds completely before storing them in a cool, dark, dry container; well-dried seeds can remain viable for several years.</p>';
  html += '<h3>Composting and soil building</h3><p>Alternate "greens" (kitchen scraps, grass clippings, for nitrogen) with "browns" (dry leaves, cardboard, straw, for carbon). Turn the pile every couple of weeks to add oxygen, and keep it about as damp as a wrung-out sponge. Leave out meat, dairy, and fats in a basic compost pile, since they attract pests and smell. Finished compost usually takes a few months to a year.</p>';
  html += '<h3>Basic livestock</h3><p>Chickens and rabbits are the two most practical animals to start with: both breed quickly, need modest space, and convert scraps and forage into food. Chickens provide eggs without needing to be slaughtered, but require a secure, predator-proof coop. Rabbits are quiet, breed fast, and convert grass efficiently into meat, but require dedicated care through slaughter. Keep any livestock housing predator-proof and well ventilated.</p>';
  html += '</div>';

  html += '<div class="section" id="lt-plants"><h2>&#127807; Edible &amp; Poisonous Plants</h2>';
  html += '<p>Misidentifying a wild plant can be fatal. Never eat anything from a plant you cannot positively identify, and cross-check more than one source before relying on any wild plant as food.</p>';
  html += '<h3>Common, widespread edibles</h3><table class="ref-table"><tr><th>Plant</th><th>Notes</th></tr>'+
    '<tr><td>Dandelion</td><td>Leaves, flowers, and roots are all edible; leaves grow more bitter as the plant matures.</td></tr>'+
    '<tr><td>Plantain (the weed, not the fruit)</td><td>Broad, low-growing leaves; also used topically as a poultice for minor skin irritation and stings.</td></tr>'+
    '<tr><td>Cattail</td><td>Young shoots and roots are edible; grows in wet ground near water.</td></tr>'+
    '<tr><td>Clover</td><td>Edible in small amounts, best cooked; raw clover in quantity can cause bloating.</td></tr>'+
    '<tr><td>Chickweed</td><td>Low, tender edible green common in disturbed soil and gardens.</td></tr>'+
    '<tr><td>Wild blackberry / raspberry</td><td>Recognizable bramble fruit; avoid unfamiliar white or pale berries entirely.</td></tr>'+
    '</table>';
  html += renderWarning("Dangerous look-alikes", ["Poison hemlock and water hemlock closely resemble wild carrot (Queen Anne's Lace) and wild parsnip - both hemlocks are extremely toxic and can be fatal in small amounts. Hemlock stems usually show purple blotches and are smooth; wild carrot stems are hairy.","Death cap and destroying angel mushrooms closely resemble edible varieties - never eat wild mushrooms without expert identification. Symptoms can appear many hours after serious damage is already done.","Pokeweed berries look like edible dark berries, but the entire plant is toxic.","Treat any white or pale berries as inedible by default."]);
  html += '<h3>Universal Edibility Test (last resort only)</h3><p>Use this only when no positively identified food source is available, and only on a plant that is abundant nearby, since a full test uses small amounts over many hours. Do not eat anything else for several hours beforehand, and test only one plant part at a time.</p>';
  html += renderSteps(["Separate the plant into parts (leaves, stem, roots) and test only one part at a time.","Smell it - a strong, unpleasant, or almond-like odor is a bad sign. Stop if so.","Rub a piece on the inner wrist or elbow and wait 15 minutes. Stop at any burning, itching, rash, or numbness.","Touch a small piece to the lips for 3 minutes. Stop at any burning or tingling.","Hold a small piece on the tongue for 15 minutes without swallowing. Stop at any bad reaction.","Chew a small piece for 15 minutes without swallowing, then spit it out. Stop at any bad reaction.","Swallow a small amount and wait 8 hours, eating or drinking nothing else. Stop at any nausea, cramping, or other symptoms.","If there is no reaction after 8 hours, eat a slightly larger amount and wait another 8 hours before treating that plant part as food."]);
  html += renderWarning("Stop the test immediately if", ["Any burning, numbness, tingling, or rash appears at any stage.","Nausea, vomiting, or stomach cramps develop.","Dizziness or difficulty breathing occurs."]);
  html += '</div>';

  html += '<div class="section" id="lt-preservation"><h2>&#128230; Food Preservation &amp; Long-Term Water</h2>';
  html += '<h3>Drying</h3><p>The oldest and most reliable preservation method - it removes the moisture pathogens need to grow. Thin-slice meat or vegetables and dry using sun, air, or gentle heat until leathery and brittle, then store fully dried food in a sealed, dry container.</p>';
  html += '<h3>Smoking</h3><p>Cold smoking adds flavor and some short-term preservation at low temperatures without fully cooking the food. Hot smoking cooks the meat while adding smoke flavor and extends storage somewhat longer. Neither replaces proper curing or refrigeration for long-term safety.</p>';
  html += '<h3>Salt curing and brining</h3><p>Salt draws out moisture and creates an environment hostile to most bacteria. A basic dry cure works salt thoroughly into meat, then leaves it in a cool location for days depending on thickness. Brining (salt dissolved in water) works similarly for smaller cuts.</p>';
  html += '<h3>Root cellaring</h3><p>A cool, humid, dark space - a dug-out cellar, buried barrel, or unheated basement corner - can store root vegetables for months. Potatoes, carrots, beets, and cabbage store well; leafy greens and most fruit do not.</p>';
  html += '<h3>Canning</h3><p>High-acid foods (fruit, pickles, most tomatoes) can be safely preserved with a water-bath canner. Low-acid foods (most vegetables, meat) require pressure canning to reach a high enough temperature to destroy Clostridium botulinum spores.</p>';
  html += renderWarning("Botulism risk", ["Never water-bath can low-acid vegetables or meat - it does not reach a temperature high enough to kill botulism spores.","Discard any canned food with a bulging lid, off smell, or spurting liquid when opened. Do not taste it to check."]);
  html += '<h3>Long-term water</h3><p>Rainwater catchment from a roof into a covered, food-grade container is one of the most reliable long-term water sources; divert the first flush of runoff, which carries the most roof debris, away from storage. A simple biosand or ceramic filter can make cloudy water usable for washing, and combined with boiling or chemical treatment, safer to drink. Rotate stored drinking water every six to twelve months and keep containers out of direct sunlight.</p>';
  html += '</div>';

  html += '<div class="section" id="lt-health"><h2>&#129532; Sanitation, Hygiene &amp; Extended Medicine</h2>';
  html += renderWarning("Sanitation is a priority, not an afterthought", ["Poor sanitation has historically caused more deaths after a disaster than violence or starvation - treat it accordingly."]);
  html += '<h3>Latrines</h3><p>A simple cathole - roughly 6-8 in (15-20 cm) deep, at least 200 ft (60 m) from any water source - works for a short stay. For longer-term use, a deeper pit latrine with a simple cover and seat reduces smell and flies; add a layer of ash or dry soil after each use to speed breakdown and control odor.</p>';
  html += '<h3>Handwashing without plumbing</h3><p>A "tippy-tap" - a hanging, tilted container with a small hole that releases a trickle of water when tipped by a foot pedal or string - uses very little water for effective handwashing. Ash can serve as a rough soap substitute in a true emergency. Wash hands after using the latrine, before handling food or water, and after handling raw meat.</p>';
  html += '<h3>Extended wound care</h3><p>Without access to a hospital, clean wounds daily with the cleanest available water, change dressings regularly, and watch closely for spreading redness, warmth, red streaking, fever, or pus - all signs of infection needing urgent care if at all possible. Raw honey has genuine antimicrobial properties and has been used as a wound dressing when nothing else is available.</p>';
  html += '<h3>Managing chronic conditions</h3><p>Stockpiling a longer supply of any regular medication, along with a written list of dosages and conditions, is worth far more than any improvised alternative. Herbal or folk remedies are not a substitute for insulin, blood pressure medication, or other prescribed treatment.</p>';
  html += '<h3>Herbal remedies (supportive care only)</h3>';
  html += renderWarning("Not a substitute for real medicine", ["Herbal remedies are supportive care at best, not a substitute for antibiotics or emergency medical treatment.","When in doubt about a plant's identity or safety, do not use it medicinally."]);
  html += '<p>A few widely documented supportive uses: crushed plantain leaf as a poultice for minor skin irritation or insect stings, garlic for its mild antimicrobial properties in food, and chamomile or mint as a calming tea. None of these treat serious infection, injury, or illness.</p>';
  html += '</div>';

  html += '<div class="section" id="lt-barter"><h2>&#128260; Barter &amp; Scavenging</h2>';
  html += '<h3>What holds trade value</h3><p>Small, practical, consumable goods tend to hold the most trade value: batteries, over-the-counter medication and first aid supplies, hygiene products, hand tools, seeds, fuel, and clean water containers. Skills - the ability to fix things, treat injuries, or grow food - are often worth more than any physical good.</p>';
  html += '<h3>Scavenging safely</h3><ul>'+
    '<li>Avoid entering a structure alone if possible, and tell someone where you are going.</li>'+
    '<li>Test floors and stairs before putting full weight on them - fire, water, and time weaken structures quickly.</li>'+
    '<li>Watch for gas smells, standing water near electrical sources, and mold - all can be more dangerous than the search itself.</li>'+
    '<li>Note your exit before going further inside.</li>'+
    '<li>Take only what is needed and can be carried - overloading slows you down when it matters most.</li>'+
  '</ul></div>';

  html += '<div class="section" id="lt-power"><h2>&#128295; Off-Grid Power &amp; Tool Maintenance</h2>';
  html += '<h3>Basic solar and battery power</h3><p>A small solar panel paired with a battery bank can keep essentials running - a radio, lights, and small medical devices - though it will not power large appliances. Prioritize charging what actually matters (communication, light, medical needs) over convenience items, and keep panels clean and angled toward the sun for the best output.</p>';
  html += '<h3>Hand-crank and battery basics</h3><p>Hand-crank radios and flashlights remove batteries as a point of failure entirely. Store spare batteries in a cool, dry place, and rotate stock so nothing sits unused for years.</p>';
  html += '<h3>Tool maintenance</h3><p>A well-maintained hand tool will outlast several cheap replacements. Keep cutting edges sharp - a dull blade is more dangerous, not less, since it requires more force to use. Wipe metal tools dry and lightly oil them to prevent rust, especially in humid conditions. Learning basic repair - resharpening, re-handling, patching - matters more long-term than any single tool owned.</p>';
  html += '</div>';

  html += '<div class="section" id="lt-community"><h2>&#129309; Community Resilience</h2>';
  html += '<h3>Low profile</h3><p>Avoid signaling that supplies are available when others may not have them - lit windows at night, visible food stores, or loose talk about what is stocked can draw unwanted attention. This is not about secrecy from trusted neighbors, but about not broadcasting vulnerability to strangers.</p>';
  html += '<h3>Mutual aid</h3><p>A small, trusted group pooling skills and labor is consistently more resilient than any individual or household alone - one person who can treat injuries, one who can fix things, and one who can grow food cover far more ground together than any one of them could alone. Build these relationships before they are needed.</p>';
  html += '<h3>Conflict de-escalation</h3><p>The safest outcome in almost any tense encounter is the one that ends without confrontation. Stay calm, keep hands visible, give people an easy way to back down without losing face, and prioritize disengaging and creating distance over standing your ground. Avoiding a conflict entirely is always the better outcome than winning one.</p>';
  html += '</div>';

  return html;
}

/* ---- Quiz ---- */
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function renderQuiz(){
  if(!state.quiz.order){ state.quiz.order = shuffle(QUIZ_QUESTIONS.map(function(_,i){return i;})); state.quiz.idx=0; state.quiz.score=0; state.quiz.answered=0; state.quiz.done=false; }
  var html = '<div class="breadcrumb"><button data-go="home">&larr; Home</button></div>';
  html += '<div class="section"><h2>&#10067; Knowledge Check</h2>';
  if(state.quiz.done){
    html += '<div class="result-card '+(state.quiz.score>=8?"mild":state.quiz.score>=5?"moderate":"severe")+'">';
    html += '<h3>Score: '+state.quiz.score+' / '+QUIZ_QUESTIONS.length+'</h3>';
    html += '<p>This score lives only in memory for this session - nothing is saved.</p></div>';
    html += '<button class="btn primary" id="quiz-retry">&#8635; Retake quiz</button>';
  } else {
    var qi = state.quiz.order[state.quiz.idx];
    var q = QUIZ_QUESTIONS[qi];
    html += '<p style="color:var(--text-dim)">Question '+(state.quiz.idx+1)+' of '+QUIZ_QUESTIONS.length+' &middot; Score so far: '+state.quiz.score+'</p>';
    html += '<h3>'+esc(q.q)+'</h3><div class="qbtn-list">';
    q.a.forEach(function(ans, ai){
      html += '<button class="qbtn" data-quiz-answer="'+ai+'"><span>'+esc(ans)+'</span></button>';
    });
    html += '</div><div id="quiz-feedback"></div>';
  }
  html += '</div>';
  return html;
}

/* ---------------- EVENT WIRING ---------------- */
function parseGo(goStr){
  var parts = goStr.split(":");
  if(parts[0]==="home") return {view:"home"};
  if(parts[0]==="browse") return {view:"browse"};
  if(parts[0]==="quickref") return {view:"quickref"};
  if(parts[0]==="quiz") return {view:"quiz"};
  if(parts[0]==="cat") return {view:"category", cat:parts[1]};
  if(parts[0]==="triage") return {view:"triage", flow:parts[1], node:parts[2]};
  return {view:"home"};
}

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-go]");
  if(t){ go(parseGo(t.getAttribute("data-go"))); return; }
  var fav = e.target.closest("[data-fav]");
  if(fav){
    var key = fav.getAttribute("data-fav");
    if(state.favorites.has(key)) state.favorites.delete(key); else state.favorites.add(key);
    render();
    return;
  }
  var fitem = e.target.closest("[data-go-fav]");
  if(fitem){ goFav(fitem.getAttribute("data-go-fav")); return; }
  var prev = e.target.closest("[data-viewer-prev]");
  if(prev){ stepViewer(prev.getAttribute("data-viewer-prev"), -1); return; }
  var next = e.target.closest("[data-viewer-next]");
  if(next){ stepViewer(next.getAttribute("data-viewer-next"), 1); return; }
  var qa = e.target.closest("[data-quiz-answer]");
  if(qa){ handleQuizAnswer(parseInt(qa.getAttribute("data-quiz-answer"))); return; }
  var qretry = e.target.closest("#quiz-retry");
  if(qretry){ state.quiz.order=null; render(); return; }
  var pbtn = e.target.closest("#print-btn");
  if(pbtn){ window.print(); return; }
});

/* favorites list items use data-go="fav:key" mapping - patch renderFavList to use goFav */
document.addEventListener("click", function(e){
  var t = e.target.closest('[data-go^="fav:"]');
  if(t){ e.stopPropagation(); goFav(t.getAttribute("data-go").split(":").slice(1).join(":")); }
}, true);

function stepViewer(id, dir){
  var steps = VIEWERS[id];
  var wrap = document.querySelector('[data-viewer="'+id+'"]');
  if(!wrap || !steps) return;
  var idx = parseInt(wrap.getAttribute("data-idx")) || 0;
  idx = (idx + dir + steps.length) % steps.length;
  wrap.setAttribute("data-idx", idx);
  wrap.querySelector(".viewer-stage").innerHTML = steps[idx].svg;
  wrap.querySelector(".svg-caption").textContent = steps[idx].cap;
  var dots = wrap.querySelectorAll(".step-dots span");
  dots.forEach(function(d,i){ d.classList.toggle("active", i===idx); });
}

function handleQuizAnswer(ai){
  var qi = state.quiz.order[state.quiz.idx];
  var q = QUIZ_QUESTIONS[qi];
  var correct = ai === q.correct;
  if(correct) state.quiz.score++;
  state.quiz.answered++;
  var fb = document.getElementById("quiz-feedback");
  if(fb){
    fb.innerHTML = '<div class="result-card '+(correct?"mild":"severe")+'" style="margin-top:.8rem"><h3>'+(correct?"Correct!":"Not quite")+'</h3><p>'+esc(q.a[q.correct])+' is the safer answer.</p></div>';
  }
  setTimeout(function(){
    state.quiz.idx++;
    if(state.quiz.idx >= QUIZ_QUESTIONS.length){ state.quiz.done = true; }
    render();
  }, 900);
}

var searchInput = document.getElementById("search-input");
var searchResults = document.getElementById("search-results");
function renderSearch(q){
  q = q.trim().toLowerCase();
  if(!q){ searchResults.classList.remove("show"); searchResults.innerHTML=""; return; }
  var matches = SEARCH_INDEX.filter(function(item){ return item.kw.indexOf(q) !== -1; }).slice(0,20);
  if(!matches.length){
    searchResults.innerHTML = '<div class="sr-empty">No results for "'+esc(q)+'"</div>';
  } else {
    searchResults.innerHTML = matches.map(function(m, i){
      return '<button type="button" class="sr-item" data-search-idx="'+i+'"><div class="sr-cat">'+esc(m.cat)+'</div><div class="sr-title">'+esc(m.title)+'</div></button>';
    }).join("");
  }
  searchResults._matches = matches;
  searchResults.classList.add("show");
}
searchInput.addEventListener("input", function(){ renderSearch(searchInput.value); });
searchInput.addEventListener("focus", function(){ if(searchInput.value.trim()) renderSearch(searchInput.value); });
searchResults.addEventListener("click", function(e){
  var t = e.target.closest("[data-search-idx]");
  if(!t) return;
  var m = searchResults._matches[parseInt(t.getAttribute("data-search-idx"))];
  if(m){ go(m.go); searchInput.value=""; searchResults.classList.remove("show"); searchResults.innerHTML=""; }
});
document.addEventListener("click", function(e){
  if(!e.target.closest("#search-wrap")){ searchResults.classList.remove("show"); }
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ searchResults.classList.remove("show"); closeSidebar(); }
});

/* ---------------- INIT ---------------- */
buildSearchIndex();
applyFontSize();
applyUnits();
render();
})();
