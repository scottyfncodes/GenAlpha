<!--
  The mark, as the tab icon. Drawn rather than lettered for the same reason
  `ui/GenAMark.tsx` is: the circle closing by hand is the whole point, and a
  font would make it a typography trick. Closed here — the icon is the
  finished state, the game is where you watch it get there.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="14" fill="#12100F"/>
  <g fill="none" stroke="#E6402A" stroke-width="9" stroke-linecap="round">
    <path d="M 50 16 L 26 84"/>
    <path d="M 50 16 L 74 84"/>
    <path d="M 16 60 L 84 60"/>
    <circle cx="50" cy="52" r="31"/>
  </g>
</svg>
